<text x="56" y="763" font-size="17" fill="#D2DAE4">tle92466ed::SpiInterface&lt;Self&gt;: CRTP, no virtual calls; 32-bit frames with CRC-8 SAE J1850,</text>
<text x="56" y="787.7" font-size="17" fill="#D2DAE4">flush / command / dummy pipeline, reply width and CRC checked, critical-fault frames decoded</text>
